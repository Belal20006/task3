name: Sequential Jobs Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  first_job:
    name: First Job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run first job
        run: |
          echo "Executing first job..."
          # Add your commands here

  second_job:
    name: Second Job
    runs-on: ubuntu-latest
    needs: first_job
    steps:
      - name: Run second job
        run: |
          echo "First job succeeded. Executing second job..."
          # Add your commands here
